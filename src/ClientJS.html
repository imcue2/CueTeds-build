    var SESSION_KEY = 'bpl_session_token';

    var screens = {
      login: document.getElementById('screen-login'),
      forcePw: document.getElementById('screen-force-password'),
      shell: document.getElementById('screen-shell')
    };

    function showScreen(name) {
      Object.keys(screens).forEach(function (key) {
        screens[key].classList.toggle('hidden', key !== name);
      });
    }

    function getToken() {
      return localStorage.getItem(SESSION_KEY);
    }
    function setToken(token) {
      localStorage.setItem(SESSION_KEY, token);
    }
    function clearToken() {

    // Guards a "Loading…" panel against hanging forever — either because the
    // Apps Script call genuinely never returns, or because an exception
    // inside onSuccess itself would otherwise leave the loading state on
    // screen with no visible error. Wrap the body of every admin panel's
    // success handler in this so a failure always becomes visible + retryable.
    function withLoadingWatchdog_(containerEl, onSuccess, retryFn) {
      var settled = false;
      var timeoutId = setTimeout(function () {
        if (settled) return;
        settled = true;
        containerEl.innerHTML = '<p class="admin-error">This is taking longer than expected. ' +
          '<button class="btn-link" id="admin-watchdog-retry">Retry</button></p>';
        var retryBtn = document.getElementById('admin-watchdog-retry');
        if (retryBtn) retryBtn.addEventListener('click', retryFn);
      }, 15000);

      return function (result) {
        if (settled) return; // watchdog already fired and replaced the panel
        settled = true;
        clearTimeout(timeoutId);
        try {
          onSuccess(result);
        } catch (err) {
          console.error('Panel render error:', err);
          containerEl.innerHTML = '<p class="admin-error">Render error: ' + escapeHtml_(err && (err.message || String(err))) +
            ' <button class="btn-link" id="admin-watchdog-retry">Retry</button></p>';
          var retryBtn = document.getElementById('admin-watchdog-retry');
          if (retryBtn) retryBtn.addEventListener('click', retryFn);
        }
      };
    }

          .withSuccessHandler(function (result) {
            if (!result.success) {
              showAdminBanner_(result.message, true);
              return;
            }
            showAdminBanner_(
              'User created. Temporary password for ' + result.user.fullName + ': ' + result.tempPassword +
              ' (single-use — share this with them directly).',
              false
            );
            document.getElementById('admin-new-user-form').innerHTML = '';
            loadUsers_();
          })
          .withFailureHandler(function (err) { showAdminBanner_('Something went wrong: ' + (err && err.message), true); })
          .adminCreateUser(shellState.token, name, email);
      });
    }

    // ---- Module access grid ----

    function openModuleAccess_(userId, fullName) {
      adminState.currentUserId = userId;
      var contentEl = document.getElementById('shell-content');
      contentEl.innerHTML =
        '<div class="content-breadcrumb">ADM / Users / ' + escapeHtml_(fullName) + '</div>' +
        '<h1 class="admin-title">Module Access — ' + escapeHtml_(fullName) + '</h1>' +
        '<button id="admin-back-btn" class="btn-link">← Back to Users</button>' +
        '<div id="admin-banner"></div>' +
        '<div id="admin-access-grid" class="admin-panel"><p class="admin-muted">Loading…</p></div>';

      document.getElementById('admin-back-btn').addEventListener('click', renderUsersList_);

      var gridEl = document.getElementById('admin-access-grid');
      var retry = function () { openModuleAccess_(userId, fullName); };
      google.script.run
        .withSuccessHandler(withLoadingWatchdog_(gridEl, function (result) {
          if (!result.success) {
            gridEl.innerHTML = '<p class="admin-error">' + escapeHtml_(result.message) + '</p>';
            return;
          }
          gridEl.innerHTML = moduleAccessTableHtml_(Array.isArray(result.grid) ? result.grid : []);
          attachModuleAccessHandlers_(userId);
        }, retry))
        .withFailureHandler(function (err) {
          gridEl.innerHTML = '<p class="admin-error">Failed to load module access: ' + escapeHtml_(err && err.message) + '</p>';
        })
        .adminGetUserModuleAccess(shellState.token, userId);
    }

    function moduleAccessTableHtml_(grid) {
      var rows = grid.map(moduleAccessRowHtml_).join('');
      return '<table class="admin-table"><thead><tr>' +
        '<th>Module</th><th>Role</th><th>Branch Scope</th><th>Tab Scope</th><th>Dashboard Scope</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function moduleAccessRowHtml_(row) {
      var meta = CODE_META[row.code];
      var label = '<span class="mod-code mod-code-light">' + row.code + '</span> ' + meta.label;

      if (row.locked) {
        return '<tr data-code="' + row.code + '">' +
          '<td>' + label + '</td>' +
          '<td colspan="4" class="admin-locked">Full Access — via ' + escapeHtml_(row.lockReason) + '</td>' +
          '</tr>';
      }

      var roleOptions = ['', 'Admin'].concat(row.code === 'OSI' ? ['Supervisor'] : []).concat(['Staff', 'View']);
      var roleSelect = '<select class="admin-role-select">' + roleOptions.map(function (opt) {
        return '<option value="' + opt + '"' + (opt === row.role ? ' selected' : '') + '>' + (opt || '— No access —') + '</option>';
      }).join('') + '</select>';

      var branchDisabled = !(row.role === 'Staff' && row.branchScopeType === 'branch-split');
      var branchOptions = '<option value=""' + (row.branchScope ? '' : ' selected') + ' disabled>— Select —</option>' +
        BRANCH_SCOPE_OPTIONS.map(function (opt) {
          return '<option value="' + opt + '"' + (opt === row.branchScope ? ' selected' : '') + '>' + opt + '</option>';
        }).join('');
      var branchSelect = '<select class="admin-branchscope-select"' + (branchDisabled ? ' disabled' : '') + '>' + branchOptions + '</select>';

      var tabDisabled = row.role !== 'Staff';
      var tabInput = '<input type="text" class="admin-tabscope-input" placeholder="blank = all tabs" value="' +
        escapeHtml_(row.tabScope) + '"' + (tabDisabled ? ' disabled' : '') + '>';

      var dashDisabled = row.role !== 'View';
      var dashInput = '<input type="text" class="admin-dashscope-input" placeholder="blank = all dashboards" value="' +
        escapeHtml_(row.dashboardScope) + '"' + (dashDisabled ? ' disabled' : '') + '>';

      return '<tr data-code="' + row.code + '">' +
        '<td>' + label + '</td>' +
        '<td>' + roleSelect + '</td>' +
        '<td>' + branchSelect + '</td>' +
        '<td>' + tabInput + '</td>' +
        '<td>' + dashInput + '</td>' +
        '</tr>';
    }

    function attachModuleAccessHandlers_(userId) {
      var gridEl = document.getElementById('admin-access-grid');

      Array.prototype.forEach.call(gridEl.querySelectorAll('tr[data-code]'), function (rowEl) {
        var roleSelect = rowEl.querySelector('.admin-role-select');
        if (!roleSelect) return; // locked row, nothing to wire

        var code = rowEl.getAttribute('data-code');
        var branchSelect = rowEl.querySelector('.admin-branchscope-select');
        var tabInput = rowEl.querySelector('.admin-tabscope-input');
        var dashInput = rowEl.querySelector('.admin-dashscope-input');

        function currentFields() {
          return {
            role: roleSelect.value,
            branchScope: branchSelect.value,
            tabScope: tabInput.value,
            dashboardScope: dashInput.value
          };
        }

        function save() {
          google.script.run
            .withSuccessHandler(function (result) {
              if (!result.success) {
                showAdminBanner_(result.message, true);
                openModuleAccess_(userId, adminState.users.filter(function (u) { return u.userId === userId; })[0].fullName);
                return;
              }
              showAdminBanner_('', false);
            })
            .withFailureHandler(function (err) { showAdminBanner_('Something went wrong: ' + (err && err.message), true); })
            .adminSetModuleAccess(shellState.token, userId, code, currentFields());
        }

        roleSelect.addEventListener('change', function () {
          var isStaff = roleSelect.value === 'Staff' && MODULE_BRANCH_SCOPE[code] === 'branch-split';
          var isView = roleSelect.value === 'View';
          branchSelect.disabled = !isStaff;
          tabInput.disabled = !isStaff;
          dashInput.disabled = !isView;
          // Clear values that no longer apply so a stale value from a
          // previous role isn't silently saved alongside the new one.
          if (!isStaff) { branchSelect.value = 'N/A'; tabInput.value = ''; }
          if (!isView) { dashInput.value = ''; }
          save();
        });
        branchSelect.addEventListener('change', save);
        tabInput.addEventListener('blur', save);
        dashInput.addEventListener('blur', save);
      });
    }

    // ---- Audit log ----

    function renderAuditLog_() {
      adminState.currentUserId = null;
      var contentEl = document.getElementById('shell-content');
      contentEl.innerHTML =
        '<div class="content-breadcrumb">ADM / Audit Log</div>' +
        '<h1 class="admin-title">Audit Log</h1>' +
        '<div id="admin-audit-table" class="admin-panel"><p class="admin-muted">Loading…</p></div>';

      var el = document.getElementById('admin-audit-table');
      google.script.run
        .withSuccessHandler(withLoadingWatchdog_(el, function (result) {
          if (!result.success) {
            el.innerHTML = '<p class="admin-error">' + escapeHtml_(result.message) + '</p>';
            return;
          }
          var entries = Array.isArray(result.entries) ? result.entries : [];
          if (!entries.length) {
            el.innerHTML = '<p class="admin-muted">No audit entries yet.</p>';
            return;
          }
          var rows = entries.map(auditLogRowHtml_).join('');
          el.innerHTML = '<table class="admin-table"><thead><tr>' +
            '<th>Timestamp</th><th>User</th><th>Module</th><th>Record Ref#</th><th>Action</th><th>Field Changed</th><th>Old → New</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>';
        }, renderAuditLog_))
        .withFailureHandler(function (err) {
          el.innerHTML = '<p class="admin-error">Failed to load audit log: ' + escapeHtml_(err && err.message) + '</p>';
        })
        .adminListAuditLog(shellState.token);
    }

    function auditLogRowHtml_(e) {
      return '<tr>' +
        '<td>' + formatDate_(e['Timestamp']) + '</td>' +
        '<td>' + escapeHtml_(e['User']) + '</td>' +
        '<td>' + escapeHtml_(e['Module']) + '</td>' +
        '<td>' + escapeHtml_(e['Record Ref#']) + '</td>' +
        '<td>' + escapeHtml_(e['Action']) + '</td>' +
        '<td>' + escapeHtml_(e['Field Changed']) + '</td>' +
        '<td>' + escapeHtml_(e['Old Value']) + ' → ' + escapeHtml_(e['New Value']) + '</td>' +
        '</tr>';
    }


    function renderShell(user, moduleUrls, shellVersion, token) {
      document.getElementById('shell-user-name').textContent = user.fullName;
      document.getElementById('shell-user-role').textContent = user.isSuperUser ? 'SuperUser' : 'User';
      document.getElementById('shell-user-avatar').textContent = initials(user.fullName);
      document.getElementById('version-tag').textContent = 'Shell v' + shellVersion;

      shellState.modules = user.accessibleModules || [];
      shellState.moduleUrls = moduleUrls || {};
      shellState.canManageUsers = !!user.canManageUsers;
      shellState.token = token;

      renderLauncher_();
    }

    document.getElementById('topbar-brand').addEventListener('click', function () {
      if (shellState.token) renderLauncher_();
    });

    document.getElementById('logout-btn').addEventListener('click', function () {
      var token = getToken();
      google.script.run.logout(token || '');
      clearToken();
      showScreen('login');
    });

    // ---------- Resume session on load ----------

    function resumeSession() {
      var token = getToken();
      if (!token) {
        showScreen('login');
        return;
      }
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result.valid) {
            clearToken();
            showScreen('login');
            return;
          }
          if (result.mustChangePassword) {
            showScreen('forcePw');
            return;
          }
          renderShell(result.user, result.moduleUrls, result.shellVersion, token);
          showScreen('shell');
        })
        .withFailureHandler(function () {
          clearToken();
          showScreen('login');
        })
        .validateSession(token);
    }

    resumeSession();
  })();
</script>

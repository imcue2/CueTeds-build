<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <?!= include('Stylesheet') ?>
</head>
<body>

  <!-- ===================== Login ===================== -->
  <div id="screen-login" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="brand-logo" alt="Blue Planet Logistics">
        <h1>Integrated Monitoring</h1>
      </div>

      <div id="login-error" class="auth-error hidden"></div>

      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-row">
            <input type="password" id="login-password" name="password" required autocomplete="current-password">
          </div>
          <label class="show-hide">
            <input type="checkbox" id="login-show-hide">
            Show password
          </label>
        </div>
        <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
      </form>

      <p class="auth-hint">Access is limited to Blue Planet Logistics staff.<br>Contact your administrator if you can't sign in.</p>
    </div>
  </div>

  <!-- ============= Must Change Password ============= -->
  <div id="screen-force-password" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="brand-logo" alt="Blue Planet Logistics">
        <h1>Set a New Password</h1>
        <p>Required before continuing</p>
      </div>

      <div id="force-pw-error" class="auth-error hidden"></div>

      <form id="force-pw-form" autocomplete="off">
        <div class="field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="newPassword" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" name="confirmPassword" required autocomplete="new-password">
          <label class="show-hide">
            <input type="checkbox" id="force-pw-show-hide">
            Show password
          </label>
        </div>
        <button type="submit" id="force-pw-btn" class="btn-primary">Set New Password</button>
      </form>

      <p class="auth-hint">Your temporary password can only be used once.<br>Choose a new password to continue.</p>
    </div>
  </div>

  <!-- ===================== Shell ===================== -->
  <div id="screen-shell" class="shell hidden">
    <div class="shell-topbar">
      <div class="topbar-brand" id="topbar-brand" title="Back to modules">
        <div class="logo-chip"><img class="brand-logo" alt="Blue Planet Logistics"></div>
        <div class="topbar-brand-text">
          <b class="topbar-title">Integrated Monitoring</b>
          <span class="topbar-sub">Blue Planet Logistics</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="avatar" id="shell-user-avatar"></div>
          <div>
            <div class="name" id="shell-user-name"></div>
            <div class="role" id="shell-user-role"></div>
          </div>
          <button id="logout-btn" class="logout-btn" title="Log out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="shell-version-bar"><span id="version-tag"></span></div>

    <div class="shell-main" id="shell-main"></div>
  </div>

  <?!= include('ClientJS') ?>
</body>
</html>

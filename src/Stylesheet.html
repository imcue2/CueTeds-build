<style>
  :root {
    --navy: #111c27;
    --navy-soft: #1b2734;
    --accent: #1080b0;
    --accent-dark: #0a5677;
    --pill-bg: #e4f1f7;
    --border: #e1e7ec;
    --content-bg: #f3f6f8;
    --text: #1a1a1a;
    --text-muted: #5c6b78;
    --danger: #c23a3a;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--content-bg);
  }

  .hidden { display: none !important; }

  /* ---------- Auth screens (Login / Force Change Password) ---------- */

  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    padding: 32px 28px;
  }

  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
    text-align: center;
  }

  .auth-brand .brand-logo {
    width: 200px;
    max-width: 100%;
    height: auto;
    margin-bottom: 14px;
  }

  .auth-brand h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 700;
  }

  .auth-brand p {
    margin: 2px 0 0;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field input[type="email"],
  .field input[type="password"],
  .field input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16, 128, 176, 0.15);
  }

  .password-row {
    position: relative;
  }

  .show-hide {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
  }

  .show-hide input {
    margin: 0;
  }

  .btn-primary {
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .auth-error {
    background: #fdecec;
    color: var(--danger);
    border: 1px solid #f3c4c4;
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .auth-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 16px;
    text-align: center;
    line-height: 1.5;
  }

  /* ---------- Shell ---------- */

  .shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* -- Topbar -- */

  .shell-topbar {
    height: 58px;
    flex: none;
    background: #111C27;
    color: #EAF1F5;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-right: 16px;
    border-right: 1px solid rgba(255, 255, 255, .1);
    height: 100%;
    flex-shrink: 0;
  }

  .shell-topbar .logo-chip {
    background: #fff;
    border-radius: 6px;
    padding: 5px 9px;
    display: flex;
    align-items: center;
  }

  .shell-topbar .logo-chip .brand-logo {
    height: 24px;
    width: auto;
    display: block;
  }

  .topbar-brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .topbar-title {
    font-family: Poppins, sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .2px;
  }

  .topbar-sub {
    font-size: 10px;
    letter-spacing: .7px;
    color: #7FAFC7;
    text-transform: uppercase;
  }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 4px 4px;
    background: rgba(255, 255, 255, .08);
    border-radius: 20px;
  }

  .user-chip .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    font-family: Poppins, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .user-chip .name { font-size: 12.5px; font-weight: 600; line-height: 1.15; }
  .user-chip .role { font-size: 10px; color: #7FAFC7; line-height: 1.15; }

  .logout-btn {
    background: transparent;
    border: none;
    color: #7FAFC7;
    cursor: pointer;
    display: flex;
    margin-left: 4px;
    padding: 0;
  }
  .logout-btn:hover { color: #fff; }

  /* -- Home / launcher -- */

  .topbar-brand { cursor: pointer; }

  .shell-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .launcher {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    background: var(--content-bg);
  }

  .launcher-section-label {
    font-family: Poppins, sans-serif;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .launcher-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .module-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .module-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .07);
  }

  .module-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .module-card-top .mod-icon { color: var(--accent); }

  .module-card-title {
    font-family: Poppins, sans-serif;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .module-card-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .module-card-disabled {
    cursor: default;
    background: var(--content-bg);
    opacity: .6;
  }
  .module-card-disabled:hover { border-color: var(--border); box-shadow: none; }
  .module-card-disabled .module-card-top .mod-icon { color: var(--text-muted); }
  .module-card-disabled .module-card-desc { font-style: italic; }

  .launcher-admin-section {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    max-width: 260px;
  }

  .admin-card { border-color: var(--navy); }
  .admin-card:hover { border-color: var(--navy); box-shadow: 0 4px 14px rgba(17, 28, 39, .1); }
  .admin-card .module-card-top .mod-icon { color: var(--navy); }
  .admin-card .mod-code-light { background: #e3e7eb; color: var(--navy); }

  .shell-version-bar {
    flex: none;
    background: #16222E;
    padding: 2px 12px;
    text-align: right;
  }

  .shell-version-bar #version-tag {
    font-size: 9px;
    color: rgba(255, 255, 255, .32);
    letter-spacing: .3px;
  }

  /* -- Sidebar + content -- */

  .shell-body {
    flex: 1;
    display: grid;
    grid-template-columns: 222px 1fr;
    min-height: 0;
  }

  .shell-sidebar {
    background: #111C27;
    overflow-y: auto;
    padding: 14px 0;
  }

  .sidebar-back {
    padding: 4px 18px 16px;
    font-size: 12.5px;
    font-weight: 600;
    color: #7FAFC7;
    cursor: pointer;
  }
  .sidebar-back:hover { color: #fff; }

  .sidebar-section-label {
    font-family: Poppins, sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: #7FAFC7;
    padding: 4px 18px 10px;
  }

  .side-tab {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 18px;
    color: #C7D3DC;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-left: 3px solid transparent;
    background: transparent;
  }

  .side-tab.active {
    color: #fff;
    border-left-color: var(--accent);
    background: #1A2A38;
  }

  .shell-content {
    overflow-y: auto;
    padding: 28px 32px;
    background: var(--content-bg);
  }

  .content-breadcrumb {
    font-family: Poppins, sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .4px;
    margin-bottom: 4px;
  }

  .placeholder-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 640px;
  }

  .placeholder-card h1 {
    margin: 0 0 12px;
    font-family: Poppins, sans-serif;
    font-size: 20px;
  }

  .placeholder-card p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
  }

  /* -- Manage User -- */

  .admin-title {
    font-family: Poppins, sans-serif;
    font-size: 20px;
    margin: 0 0 14px;
  }

  .admin-muted { color: var(--text-muted); font-size: 13px; }
  .admin-error { color: var(--danger); font-size: 13px; }

  .admin-banner {
    background: #e4f1f7;
    border: 1px solid #bcdcea;
    color: #0a5677;
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .admin-banner-error {
    background: #fdecec;
    border-color: #f3c4c4;
    color: var(--danger);
  }

  .admin-panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    max-width: 100%;
    overflow-x: auto;
  }

  .admin-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 12px;
  }

  .admin-inline-form {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .admin-inline-form input {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
  }

  .btn-small {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .btn-small:hover { background: var(--content-bg); }

  .btn-small-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-small-primary:hover { background: var(--accent-dark); }

  .btn-link {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-right: 12px;
  }
  .btn-link:hover { text-decoration: underline; }
  .btn-link.admin-danger { color: var(--danger); }

  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .admin-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-muted);
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .admin-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .admin-table select,
  .admin-table input[type="text"] {
    font-size: 12.5px;
    font-family: inherit;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    min-width: 110px;
  }

  .admin-table select:disabled,
  .admin-table input:disabled {
    background: var(--content-bg);
    color: var(--text-muted);
  }

  .admin-status {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .admin-status-active { background: #e3f3e6; color: #1f7a34; }
  .admin-status-inactive { background: #f1f1f1; color: #67707a; }

  .admin-pill {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-dark);
    background: var(--pill-bg);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 4px;
  }

  .admin-locked {
    color: var(--text-muted);
    font-style: italic;
    font-size: 12.5px;
  }

  .mod-code-light {
    font-family: Poppins, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .4px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--pill-bg);
    color: var(--accent-dark);
  }
</style>

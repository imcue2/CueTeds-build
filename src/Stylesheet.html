<style>
  :root {
    --navy: #111c27;
    --navy-soft: #1b2734;
    --accent: #1080b0;
    --accent-dark: #0a5677;
    --pill-bg: #e4f1f7;
    --border: #e1e7ec;
    --content-bg: #f3f6f8;
    --text: #1a1a1a;
    --text-muted: #5c6b78;
    --danger: #c23a3a;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--content-bg);
  }

  .hidden { display: none !important; }

  /* ---------- Auth screens (Login / Force Change Password) ---------- */

  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    padding: 32px 28px;
  }

  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
    text-align: center;
  }

  .auth-brand .brand-logo {
    width: 200px;
    max-width: 100%;
    height: auto;
    margin-bottom: 14px;
  }

  .auth-brand h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 700;
  }

  .auth-brand p {
    margin: 2px 0 0;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field input[type="email"],
  .field input[type="password"],
  .field input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16, 128, 176, 0.15);
  }

  .password-row {
    position: relative;
  }

  .show-hide {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
  }

  .show-hide input {
    margin: 0;
  }

  .btn-primary {
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .auth-error {
    background: #fdecec;
    color: var(--danger);
    border: 1px solid #f3c4c4;
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .auth-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 16px;
    text-align: center;
    line-height: 1.5;
  }

  /* ---------- Shell (post-login placeholder) ---------- */

  .shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .shell-header {
    height: 58px;
    flex: none;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    color: #fff;
  }

  .shell-header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .shell-header .logo-chip {
    background: #fff;
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
  }

  .shell-header .logo-chip .brand-logo {
    height: 22px;
    width: auto;
    display: block;
  }

  .shell-header .brand-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
  }

  .shell-header .right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .user-chip .name { font-size: 12px; font-weight: 600; line-height: 1.2; }
  .user-chip .role { font-size: 10px; color: #7fafc7; }

  .logout-btn {
    background: none;
    border: none;
    color: #cfd9e0;
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
  }
  .logout-btn:hover { color: #fff; }

  .shell-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .shell-sidebar {
    width: 220px;
    flex: none;
    background: var(--navy);
    color: #cfd9e0;
    overflow-y: auto;
    padding: 16px 0;
  }

  .shell-sidebar .section-label {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6c7f8e;
    padding: 0 20px 8px;
  }

  .shell-sidebar .nav-item {
    padding: 10px 20px;
    font-size: 13px;
    cursor: default;
    color: #cfd9e0;
  }

  .shell-sidebar .nav-item.placeholder {
    color: #6c7f8e;
    font-style: italic;
  }

  .shell-content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }

  .placeholder-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 640px;
  }

  .placeholder-card h2 {
    margin-top: 0;
    font-size: 18px;
  }

  .placeholder-card p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }
</style>
